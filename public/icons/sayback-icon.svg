<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="SayBack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="44" fill="#0f172a"/>
  <!-- outgoing voice (violet) -->
  <g stroke="#8b5cf6" stroke-width="9" stroke-linecap="round">
    <line x1="50" y1="52" x2="50" y2="84"/>
    <line x1="30" y1="60" x2="30" y2="76"/>
  </g>
  <!-- echo coming back (cyan, mirrored) -->
  <g stroke="#06b6d4" stroke-width="9" stroke-linecap="round">
    <line x1="142" y1="52" x2="142" y2="84"/>
    <line x1="162" y1="60" x2="162" y2="76"/>
  </g>
  <!-- mic -->
  <rect x="76" y="34" width="40" height="66" rx="20" fill="url(#g)"/>
  <path d="M63 88v4a33 33 0 0 0 66 0v-4" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
  <line x1="96" y1="125" x2="96" y2="146" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
  <line x1="78" y1="148" x2="114" y2="148" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
</svg>
